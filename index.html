<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packcode | Gerador Profissional de Código de Barras</title>
    <link rel="icon" href="https://i.imgur.com/DGPKpOR.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary: #f9b233; /* Laranja solicitado */
            --primary-hover: #e09e29;
            --bg: #0a0a0a; /* Fundo super escuro estilo Moncash */
            --surface: #141414; /* Painéis um pouco mais claros */
            --surface-hover: #1f1f1f;
            --text: #ffffff;
            --text-light: #a3a3a3;
            --border: #262626;
            --error: #ef4444;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; min-height: 100vh; }

        /* Tela de Carregamento (Loader) */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loader img { width: 200px; margin-bottom: 24px; animation: pulse 2s infinite ease-in-out; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }

        .container {
            max-width: 1000px; width: 100%; display: grid; grid-template-columns: 350px 1fr; gap: 2rem;
            opacity: 0; animation: fadeIn 0.8s ease forwards; animation-delay: 1s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .panel {
            background: var(--surface); padding: 1.5rem; border-radius: 12px;
            border: 1px solid var(--border);
        }

        .brand-logo { max-width: 160px; margin-bottom: 1.5rem; display: block; }
        h2 { font-size: 1rem; margin-bottom: 1rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-light); }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 0.75rem; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(249, 178, 51, 0.2); }

        /* Estilo do Input de Dígito Verificador (Separado) */
        .input-row { display: flex; gap: 0.5rem; align-items: flex-start; }
        .input-main { flex: 1; }
        .check-digit-box {
            width: 50px; padding: 0.75rem 0; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold; color: var(--primary); display: none;
        }

        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
        .checkbox-group input[type="checkbox"] { accent-color: var(--primary); width: 18px; height: 18px; }

        .preview-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #ffffff; /* Fundo branco sempre para pré-visualização real */
            min-height: 300px; border: 1px dashed var(--border); border-radius: 8px;
            padding: 2rem; margin-bottom: 1.5rem; overflow: hidden;
        }

        .actions { display: flex; gap: 1rem; justify-content: center; }

        button {
            padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        .error-msg { color: var(--error); font-size: 0.875rem; margin-top: 0.5rem; display: none; }
        .status-badge {
            display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-bottom: 1rem;
        }
        .status-valid { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-invalid { background: rgba(239, 68, 68, 0.2); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>

<div id="loader">
    <img src="https://i.imgur.com/oJePfiC.png" alt="Packcode Logo">
    <div class="spinner"></div>
</div>

<div class="container">
    <div class="panel controls">
        <img src="https://i.imgur.com/oJePfiC.png" alt="Packcode" class="brand-logo">
        
        <div class="form-group">
            <label for="barcodeType">Padrão do Código</label>
            <select id="barcodeType">
                <optgroup label="Mais Comuns (EAN/UPC)">
                    <option value="EAN13">EAN-13</option>
                    <option value="EAN8">EAN-8</option>
                    <option value="UPC">UPC-A</option>
                    <option value="UPCE">UPC-E</option>
                </optgroup>
                <optgroup label="Livros & Revistas">
                    <option value="ISBN">ISBN (EAN-13)</option>
                    <option value="ISSN">ISSN (EAN-13)</option>
                </optgroup>
                <optgroup label="Industriais & Logística">
                    <option value="ITF14">ITF-14</option>
                    <option value="ITF">ITF (Interleaved 2 of 5)</option>
                    <option value="CODE128">Code 128</option>
                    <option value="CODE39">Code 39</option>
                    <option value="codabar">CodaBar</option>
                    <option value="pharmacode">Pharmacode</option>
                    <option value="MSI">MSI/Plessey</option>
                </optgroup>
                <optgroup label="Variações Internacionais">
                    <option value="JAN13">JAN-13</option>
                    <option value="JAN8">JAN-8</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="barcodeData" id="labelData">Dados do Código</label>
            <div class="input-row">
                <input type="text" id="barcodeData" class="input-main" placeholder="Ex: 789123456789">
                <div class="check-digit-box" id="checkDigitBox" title="Dígito Verificador">0</div>
            </div>
            <div id="errorMsg" class="error-msg">Código inválido para o padrão selecionado.</div>
        </div>

        <div class="form-group">
            <label for="moduleWidth">Largura do Módulo (px)</label>
            <input type="number" id="moduleWidth" value="2" min="1" step="0.5">
        </div>

        <div class="form-group">
            <label for="barcodeHeight">Altura das Barras (px)</label>
            <input type="number" id="barcodeHeight" value="80" min="20">
        </div>

        <div class="form-group">
            <label for="quietZone">Margem de Segurança (px)</label>
            <input type="number" id="quietZone" value="15" min="0">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showText" checked>
            <label for="showText" style="margin: 0; color: var(--text);">Exibir numeração (OCR-B)</label>
        </div>
    </div>

    <div class="panel">
        <h2>Pré-visualização Vetorial</h2>
        <div id="statusBadge" class="status-badge status-valid">Pronto</div>
        
        <div class="preview-area">
            <svg id="barcodePreview"></svg>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="downloadSVG()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Baixar SVG
            </button>
            <button class="btn-secondary" onclick="copySVG()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copiar
            </button>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(() => loader.style.display = 'none', 600);
        }, 800); 
    });

    const elements = {
        type: document.getElementById('barcodeType'),
        data: document.getElementById('barcodeData'),
        width: document.getElementById('moduleWidth'),
        height: document.getElementById('barcodeHeight'),
        margin: document.getElementById('quietZone'),
        showText: document.getElementById('showText'),
        preview: document.getElementById('barcodePreview'),
        errorMsg: document.getElementById('errorMsg'),
        statusBadge: document.getElementById('statusBadge'),
        checkBox: document.getElementById('checkDigitBox')
    };

    // Função de cálculo de dígito verificador padrão (EAN/UPC/JAN/ISBN)
    function calculateCheckDigit(code, type) {
        if (!/^\d+$/.test(code)) return null;
        
        let multiplierEven, multiplierOdd, lengthReq;

        if (type === 'EAN13' || type === 'ISBN' || type === 'ISSN' || type === 'JAN13') {
            lengthReq = 12; multiplierEven = 1; multiplierOdd = 3;
        } else if (type === 'UPC') {
            lengthReq = 11; multiplierEven = 3; multiplierOdd = 1;
        } else if (type === 'EAN8' || type === 'JAN8') {
            lengthReq = 7; multiplierEven = 3; multiplierOdd = 1;
        } else {
            return null; // Não aplica validação visual extra
        }

        if (code.length !== lengthReq) return null;

        let sum = 0;
        for (let i = 0; i < lengthReq; i++) {
            sum += parseInt(code[i], 10) * (i % 2 === 0 ? multiplierEven : multiplierOdd);
        }
        const remainder = sum % 10;
        return remainder === 0 ? 0 : 10 - remainder;
    }

    function renderBarcode() {
        let rawValue = elements.data.value.trim();
        let selectedType = elements.type.value;
        let barcodeFormat = selectedType;

        // Mapeamento de formatos visuais para o motor da biblioteca JsBarcode
        if (selectedType === 'ISBN' || selectedType === 'ISSN' || selectedType === 'JAN13') barcodeFormat = 'EAN13';
        if (selectedType === 'JAN8') barcodeFormat = 'EAN8';

        elements.errorMsg.style.display = 'none';
        elements.statusBadge.className = 'status-badge status-valid';
        elements.statusBadge.innerText = 'Válido';
        elements.checkBox.style.display = 'none';
        
        // Controle da UI do dígito verificador
        const needsCheckDigit = ['EAN13', 'ISBN', 'ISSN', 'JAN13', 'UPC', 'EAN8', 'JAN8'];
        let finalValue = rawValue;

        if (needsCheckDigit.includes(selectedType) && rawValue.length > 0) {
            let requiredLength = (selectedType === 'EAN8' || selectedType === 'JAN8') ? 7 : (selectedType === 'UPC' ? 11 : 12);
            elements.data.maxLength = requiredLength;
            
            const checkDigit = calculateCheckDigit(rawValue, selectedType);
            
            if (checkDigit !== null) {
                elements.checkBox.style.display = 'flex';
                elements.checkBox.innerText = checkDigit;
                finalValue = rawValue + checkDigit; // Junta para renderizar
            }
        } else {
            elements.data.removeAttribute('maxlength');
        }

        const options = {
            format: barcodeFormat,
            width: parseFloat(elements.width.value) || 2,
            height: parseInt(elements.height.value) || 80,
            margin: parseInt(elements.margin.value) || 0,
            displayValue: elements.showText.checked,
            background: "#ffffff",
            lineColor: "#000000",
            font: "'OCR B Std', 'OCR-B', 'OCR B', monospace", // Força o padrão da indústria
            fontSize: 18,
            textMargin: 6,
            valid: function(valid) { if (!valid) showError(); }
        };

        try {
            if(!finalValue) { elements.preview.innerHTML = ''; return; }
            JsBarcode("#barcodePreview", finalValue, options);
        } catch (e) {
            showError();
        }
    }

    function showError() {
        elements.preview.innerHTML = '';
        elements.errorMsg.style.display = 'block';
        elements.statusBadge.className = 'status-badge status-invalid';
        elements.statusBadge.innerText = 'Inválido';
        elements.checkBox.style.display = 'none';
    }

    function getSVGString() {
        const svgNode = elements.preview;
        if (!svgNode.innerHTML) return null;
        const serializer = new XMLSerializer();
        let svgString = serializer.serializeToString(svgNode);
        if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        return svgString;
    }

    function downloadSVG() {
        const svgString = getSVGString();
        if (!svgString) { alert("Gerador vazio."); return; }
        const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url; link.download = `packcode-${elements.type.value}.svg`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
    }

    async function copySVG() {
        const svgString = getSVGString();
        if (!svgString) { alert("Gerador vazio."); return; }
        try {
            await navigator.clipboard.writeText(svgString);
            alert("Vetor copiado! Cole no Illustrator ou Corel.");
        } catch (err) { alert("Erro ao copiar."); }
    }

    ['input', 'change'].forEach(evt => {
        elements.type.addEventListener(evt, () => { elements.data.value = ''; renderBarcode(); });
        elements.data.addEventListener(evt, renderBarcode);
        elements.width.addEventListener(evt, renderBarcode);
        elements.height.addEventListener(evt, renderBarcode);
        elements.margin.addEventListener(evt, renderBarcode);
        elements.showText.addEventListener(evt, renderBarcode);
    });

    renderBarcode();
</script>
</body>
</html>
